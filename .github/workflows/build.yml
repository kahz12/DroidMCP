name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the tag is in the
# trailing comment) so a moved or compromised tag cannot change what runs —
# the release job holds contents:write and the OIDC token used for signing.
# Dependabot (.github/dependabot.yml) proposes the updates. Tool versions are
# pinned too, so a new linter release cannot fail CI on unchanged code.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w .' (or 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      # Releases are ARM64-only; build that target on every push and PR so a
      # platform-specific break shows up here rather than at tag time.
      - name: Cross-compile linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

  gosec:
    name: Security (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # gosec runs on the job's Go rather than through securego/gosec's Docker
      # action: that image bundles its own Go (with GOTOOLCHAIN=local), which
      # falls behind the go directive in go.mod and then cannot load the
      # module at all. Mirror the gosec excludes declared in .golangci.yml so
      # the standalone binary applies the same policy as the lint job;
      # rationale for each rule lives there (linters.settings.gosec.excludes).
      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude=G104,G115,G204,G301,G304,G306,G404 ./...

  govulncheck:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Fails only on vulnerabilities in code the servers actually call,
      # including the standard library of the Go version above.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build ARM64 Binaries
    needs: [test, lint, gosec, govulncheck]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service: [filesystem, github, scraper, termux, network, clipboard, media, sqlite, sensors, notifications, contacts, sms, llmproxy, automation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build reproducible binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOFLAGS: "-trimpath"
          VERSION: ${{ github.ref_name }}
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -buildid= -X github.com/kahz12/droidmcp/internal/buildinfo.Version=${VERSION}" \
            -o droidmcp-${{ matrix.service }} \
            ./cmd/${{ matrix.service }}

      - name: Generate per-binary SHA256
        run: sha256sum droidmcp-${{ matrix.service }} > droidmcp-${{ matrix.service }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidmcp-${{ matrix.service }}
          path: |
            droidmcp-${{ matrix.service }}
            droidmcp-${{ matrix.service }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Flatten artifacts and build SHA256SUMS
        run: |
          mkdir -p release
          for d in droidmcp-*; do
            cp "$d"/* release/
          done
          cd release
          rm -f *.sha256
          sha256sum droidmcp-* > SHA256SUMS
          ls -la

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign SHA256SUMS (keyless)
        run: |
          cosign sign-blob \
            --yes \
            --output-signature release/SHA256SUMS.sig \
            --output-certificate release/SHA256SUMS.pem \
            release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/droidmcp-filesystem
            release/droidmcp-github
            release/droidmcp-scraper
            release/droidmcp-termux
            release/droidmcp-network
            release/droidmcp-clipboard
            release/droidmcp-media
            release/droidmcp-sqlite
            release/droidmcp-sensors
            release/droidmcp-notifications
            release/droidmcp-contacts
            release/droidmcp-sms
            release/droidmcp-llmproxy
            release/droidmcp-automation
            release/SHA256SUMS
            release/SHA256SUMS.sig
            release/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
